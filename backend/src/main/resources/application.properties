# Database Configuration
# These values will be overridden by environment variables in Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/woodyz_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Security
# IMPORTANT: set APP_JWT_SECRET in your deployment environment. Do not use a committed default secret in production.
app.jwtSecret=${APP_JWT_SECRET}
app.jwtExpirationMs=3600000

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# SendGrid Configuration
sendgrid.api.key=${SENDGRID_API_KEY}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY}

# Frontend origin used by the CORS configuration.
app.frontendOrigin=${FRONTEND_ORIGIN:http://localhost:3000}

# Redis Configuration
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000ms
